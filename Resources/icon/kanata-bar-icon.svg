    <!-- Photoshop Outer Glow: size 38 / choke 22% / opacity 34% / screen / white.
         Screen with white == normal blending of white at the same alpha, so no blend mode needed. -->
    <filter id="neon_glow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/>
      <feGaussianBlur in="d" stdDeviation="15" result="b"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.34"/>
      <feComposite in2="b" operator="in" result="glow"/>
    </filter>
